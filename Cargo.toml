[package]
name = "defuse-tester"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["cookies", "multipart"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
regex = "1"
quick-xml = "0.37"

[[bin]]
name = "stress"
path = "src/bin/stress.rs"

[dev-dependencies]
serial_test = "3"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
